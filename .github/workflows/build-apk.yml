name: Build VR Box Web Mirror APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v7

      - name: Cài JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK
        uses: android-actions/setup-android@v4

      - name: Cài Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Build APK (debug)
        run: gradle assembleDebug --stacktrace

      - name: Đổi tên file APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VRBoxWebMirror.apk

      - name: Tải APK lên mục Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: VRBoxWebMirror-APK
          path: VRBoxWebMirror.apk
          if-no-files-found: error

      - name: Tạo Release (chỉ khi đẩy tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: VRBoxWebMirror.apk
